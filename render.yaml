services:
  # Backend
  - type: web
    name: finedu-flow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finedu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend
  - type: static
    name: finedu-flow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishDir: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: finedu-flow-backend
          type: web
          property: host

databases:
  - name: finedu-db
    plan: free
